[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "puggles"
version = "0.1.0"
description = "Python bindings for the puggles multi-objective genetic algorithms library"
requires-python = ">=3.8"

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
